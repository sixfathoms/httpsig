[versions]
junit = "6.1.3"
jackson = "2.23.0"
okhttp = "5.5.1"
spring-webflux = "7.1.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
spring-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring-webflux" }
reactor-core = { module = "io.projectreactor:reactor-core", version = "3.9.0" }
reactor-test = { module = "io.projectreactor:reactor-test", version = "3.9.0" }
reactor-netty = { module = "io.projectreactor.netty:reactor-netty-http", version = "1.4.0" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
