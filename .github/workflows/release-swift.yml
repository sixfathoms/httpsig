name: Release Swift

on:
  push:
    # SwiftPM resolves versions only from plain semver tags.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: swift test

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "Swift v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          body: |
            ## Swift v${{ steps.version.outputs.version }}

            ```swift
            // Package.swift
            dependencies: [
                .package(url: "https://github.com/sixfathoms/httpsig.git", from: "${{ steps.version.outputs.version }}")
            ]
            ```

            SPM resolves packages via git tags. No registry publication needed.
