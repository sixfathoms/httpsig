name: Kotlin

on:
  push:
    paths: ['kotlin/**', 'testdata/**', '.github/workflows/kotlin.yml']
  pull_request:
    paths: ['kotlin/**', 'testdata/**', '.github/workflows/kotlin.yml']
  workflow_dispatch:

# Read-only token: this runs untrusted PR code (build/test) and needs no write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check
        working-directory: kotlin
        run: ./gradlew check
