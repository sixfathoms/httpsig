name: TypeScript

on:
  push:
    paths: ['typescript/**', 'testdata/**', '.github/workflows/typescript.yml']
  pull_request:
    paths: ['typescript/**', 'testdata/**', '.github/workflows/typescript.yml']
  workflow_dispatch:

# Read-only token: this runs untrusted PR code (npm ci postinstall, tests, build) and needs no write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        working-directory: typescript
        run: npm ci

      - name: Lint
        working-directory: typescript
        run: npx tsc --noEmit

      - name: Test
        working-directory: typescript
        run: npx vitest run

      - name: Build
        working-directory: typescript
        run: npm run build
